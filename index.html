<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แชตคนใกล้ตัว สมุทรสงคราม</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f7;--card:#fff;--tx:#1d2330;--mut:#7a8394;--ac:#1f9d7a;--me:#d8f3ea;--bd:#e1e5ea}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1c222b;--tx:#eceff4;--mut:#8a93a3;--ac:#35c19a;--me:#17433a;--bd:#2a313c}}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Thai",sans-serif;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:10px;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px}
.row{display:flex;gap:8px;align-items:center}
.row+.row{margin-top:8px}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;min-height:44px;min-width:0}
input,select{flex:1;width:100%}
#tabs button{flex:1;font-size:13px;padding:8px}
button.p{background:var(--ac);color:#fff;border:0;font-weight:600}
button:disabled,select:disabled{opacity:.6}
.mut{color:var(--mut);font-size:12px}
.people{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.chip{flex:none;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:6px 10px;font-size:13px}
.chip b{color:var(--ac)}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:120px}
.m{max-width:82%;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:7px 11px;font-size:14px;word-break:break-word}
.m.me{align-self:flex-end;background:var(--me);border-color:transparent}
.m small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px}
</style>
</head>
<body>
<div class="card">
  <div class="row" id="tabs"><button class="p" data-r="general">💬 แชตทั่วไป</button><button data-r="checkpoint">🚔 ตรวจสอบด่านตรวจในจังหวัด</button></div>
  <div class="row"><input id="nm" maxlength="12" placeholder="ชื่อของคุณ"></div>
  <div class="row">
    <select id="prov" disabled><option>จังหวัดสมุทรสงคราม</option></select>
    <select id="dist"><option value="">เลือกอำเภอ…</option><option value="0">อ.เมือง</option><option value="1">อ.อัมพวา</option><option value="2">อ.บางคนที</option></select>
  </div>
  <div class="row"><span class="mut" style="white-space:nowrap">แสดงข้อความ:</span>
    <select id="rad"><option value="0">เฉพาะอำเภอเดียวกัน</option><option value="7">ใน 7 กม.</option><option value="99" selected>ทั้งจังหวัด</option></select></div>
  <div class="people" id="ppl"></div>
</div>
<div id="msgs"></div>
<div class="row"><input id="ci" maxlength="200" placeholder="พิมพ์ข้อความ…"><button id="cb" class="p" disabled>ส่ง</button></div>
<div class="mut" id="st" style="text-align:center">กำลังเชื่อมต่อ…</div>
<script>
var $=function(i){return document.getElementById(i)};
var AREAS=[["อ.เมือง",13.41,100.002],["อ.อัมพวา",13.427,99.956],["อ.บางคนที",13.368,99.936]];
var d=null,people=[],chat={general:[],checkpoint:[]},room="general",myId,me="ผู้ใช้"+Math.floor(100+Math.random()*900);
try{
  myId=localStorage.getItem("smid");
  if(!myId){myId=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("smid",myId)}
  me=localStorage.getItem("smn")||me;var sd=localStorage.getItem("smd");if(sd!==null&&sd!=="")d=+sd;
}catch(e){}
if(!myId)myId=Math.random().toString(36).slice(2)+Date.now().toString(36);
$("nm").value=me;if(d!==null)$("dist").value=d;
function km(a,b){var R=6371,r=Math.PI/180,x=(AREAS[b][1]-AREAS[a][1])*r,y=(AREAS[b][2]-AREAS[a][2])*r,
  h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(AREAS[a][1]*r)*Math.cos(AREAS[b][1]*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function far(x){return x===d?"อำเภอเดียวกัน":AREAS[x][0]+" · ประมาณ "+Math.round(km(d,x))+" กม."}
function ok(x){var r=+$("rad").value;return r===99||(r===0?x===d:x===d||km(d,x)<=r)}
function render(){
  var pe=$("ppl"),box=$("msgs");pe.textContent="";box.textContent="";
  if(d===null){pe.className="mut";pe.textContent="เลือกอำเภอของคุณเพื่อเริ่มแชต";
    var h=document.createElement("div");h.className="mut";h.style.textAlign="center";h.textContent="เลือกอำเภอด้านบนก่อนนะ";box.appendChild(h);return}
  pe.className="people";
  var list=people.filter(function(p){return p.id!==myId&&AREAS[p.d]&&ok(p.d)}).sort(function(a,b){return km(d,a.d)-km(d,b.d)});
  if(!list.length)pe.textContent="ยังไม่มีคนอื่นออนไลน์ในระยะ";
  list.forEach(function(p){var c=document.createElement("div"),b=document.createElement("b");c.className="chip";b.textContent=p.n;c.appendChild(b);c.appendChild(document.createTextNode(" · "+far(p.d)));pe.appendChild(c)});
  (chat[room]||[]).forEach(function(m){
    if(!AREAS[m.d])return;var mine=m.u===myId;if(!mine&&!ok(m.d))return;
    var e=document.createElement("div"),s=document.createElement("small");
    e.className="m"+(mine?" me":"");s.textContent=(mine?"คุณ":m.n+" · "+far(m.d))+" · "+new Date(m.ts).toLocaleString("th-TH",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
    e.appendChild(s);e.appendChild(document.createTextNode(m.t));box.appendChild(e);
  });
  box.scrollTop=box.scrollHeight;
}
function post(url,obj){return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)})}
function beat(){if(d!==null)post("/api/presence",{id:myId,n:me,d:d}).catch(function(){})}
$("dist").onchange=function(){var v=$("dist").value;d=v===""?null:+v;try{localStorage.setItem("smd",v)}catch(e){}$("cb").disabled=d===null;beat();render()};
$("nm").onchange=function(){var v=$("nm").value.trim().slice(0,12);if(!v)return;me=v;try{localStorage.setItem("smn",me)}catch(e){}beat()};
$("rad").onchange=render;
function send(){
  var v=$("ci").value.trim();if(!v||d===null)return;
  post("/api/send",{u:myId,n:me,t:v,d:d,r:room}).then(function(r){if(r.status===429)$("st").textContent="ส่งเร็วเกินไป รอสักครู่นะ"}).catch(function(){});
  $("ci").value="";
}
$("cb").onclick=send;
$("ci").onkeydown=function(e){if(e.key==="Enter")send()};
$("cb").disabled=d===null;
var tabs=document.querySelectorAll("#tabs button");
Array.prototype.forEach.call(tabs,function(b){b.onclick=function(){
  room=b.dataset.r;
  Array.prototype.forEach.call(tabs,function(x){x.className=x.dataset.r===room?"p":""});
  $("ci").placeholder=room==="checkpoint"?"แจ้งจุดตรวจ เช่น ถนน/ช่วงเวลา…":"พิมพ์ข้อความ…";
  render();
}});
var es=new EventSource("/events");
es.addEventListener("init",function(e){var x=JSON.parse(e.data);chat={general:x.msgs.general||[],checkpoint:x.msgs.checkpoint||[]};people=x.people;$("st").textContent="ออนไลน์แล้ว";render();beat()});
es.addEventListener("msg",function(e){var m=JSON.parse(e.data);if(!chat[m.r])chat[m.r]=[];chat[m.r].push(m);if(chat[m.r].length>100)chat[m.r].shift();render()});
es.addEventListener("people",function(e){people=JSON.parse(e.data);render()});
es.onerror=function(){$("st").textContent="หลุดการเชื่อมต่อ กำลังต่อใหม่…"};
setInterval(beat,30000);
render();
</script>
</body>
</html>
